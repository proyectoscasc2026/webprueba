<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Acceso - Astur Gym</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0A2540;
            --accent-gold: #F2C94C;
            --light-bg: #F4F6F9;
            --card-bg: #FFFFFF;
            --text-dark: #1F2937;
            --text-light: #9CA3AF;
            --border-color: #E5E7EB;
            --success-color: #10B981;
            --error-color: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Contenedor Principal */
        .main-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            margin: auto;
        }

        /* Tarjeta del Formulario */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(10, 37, 64, 0.08);
            border: 1px solid var(--border-color);
            padding: 30px 25px;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary-blue), var(--accent-gold));
        }

        /* Logo y Encabezado */
        .logo-container {
            margin-bottom: 20px;
        }

        .logo-shield {
            max-width: 130px;
            height: auto;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary-blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* Estilos del Formulario */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--primary-blue);
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 14px 16px;
            font-size: 14px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background-color: #FAFBFC;
            color: var(--text-dark);
            outline: none;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary-blue);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(10, 37, 64, 0.1);
        }

        /* Botón de Envío */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-blue);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(10, 37, 64, 0.2);
        }

        .btn-submit:hover {
            background-color: #12355A;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(10, 37, 64, 0.25);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        /* Pantallas de Carga y Estado */
        .spinner {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(10, 37, 64, 0.1);
            border-left-color: var(--primary-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-message {
            display: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 20px;
            text-align: center;
            animation: fadeIn 0.4s ease forwards;
        }

        .status-message.success {
            display: block;
            background-color: #E6F4EA;
            color: var(--success-color);
            border: 1px solid #C4EED0;
        }

        .status-message.error {
            display: block;
            background-color: #FCE8E6;
            color: var(--error-color);
            border: 1px solid #FAD2CF;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer Estilizado */
        footer {
            width: 100%;
            background-color: var(--primary-blue);
            color: #FFFFFF;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            border-top: 4px solid var(--accent-gold);
        }

        .footer-text {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.8);
        }

        .logo-casc {
            max-height: 45px;
            width: auto;
            filter: brightness(0) invert(1); /* Convierte el logo a blanco puro para contrastar perfectamente */
            opacity: 0.9;
        }
    </style>
</head>

    <script>
        // REEMPLAZA ESTA URL CON LA URL DE TU WEB APP DE GOOGLE APPS SCRIPT LUEGO DE IMPLEMENTARLA
        const WEB_APP_URL = "URL_DE_TU_GOOGLE_APPS_SCRIPT_AQUI";

        function handleSubmit(event) {
            event.preventDefault();

            const nombre = document.getElementById('nombre').value.trim();
            const dni = document.getElementById('dni').value.trim();
            const convenio = document.getElementById('convenio').value;
            
            const submitBtn = document.getElementById('submitBtn');
            const spinner = document.getElementById('loadingSpinner');
            const statusMsg = document.getElementById('statusMsg');

            // Ocultar mensajes anteriores y mostrar carga
            statusMsg.className = "status-message";
            statusMsg.style.display = "none";
            submitBtn.style.display = "none";
            spinner.style.display = "block";

            // Validar que la URL haya sido configurada
            if (WEB_APP_URL === "https://script.google.com/macros/s/AKfycbwPDoclyyHyfMYPsY7NP2nb83ce2YbZZq9xkQtgVJiKk3XNA_91p9n40hlNOpHYMNKq/exec") {
                setTimeout(() => {
                    spinner.style.display = "none";
                    submitBtn.style.display = "block";
                    statusMsg.textContent = "Error de configuración: Debes reemplazar 'WEB_APP_URL' con tu URL de Google Apps Script.";
                    statusMsg.classList.add('error');
                }, 1000);
                return;
            }

            // Preparar los datos a enviar mediante URLSearchParams para evitar problemas de CORS
            const formData = new URLSearchParams();
            formData.append('nombre', nombre);
            formData.append('dni', dni);
            formData.append('convenio', convenio);

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors', // Modo requerido para Google Apps Script Web Apps de una sola vía
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData
            })
            .then(() => {
                // Como usamos no-cors, asumimos éxito si la promesa se resuelve correctamente
                spinner.style.display = "none";
                submitBtn.style.display = "block";
                statusMsg.textContent = "¡Registro guardado exitosamente!";
                statusMsg.classList.add('success');
                
                // Limpiar el formulario
                document.getElementById('accessForm').reset();
            })
            .catch(error => {
                console.error('Error:', error);
                spinner.style.display = "none";
                submitBtn.style.display = "block";
                statusMsg.textContent = "Hubo un problema al enviar los datos. Inténtalo nuevamente.";
                statusMsg.classList.add('error');
            });
        }
    </script>
</body>
</html>
